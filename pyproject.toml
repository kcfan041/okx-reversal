[project]
name = "okxrev"
version = "0.1.0"
description = "OKX USDT perpetual altcoin pump -> giant 5m red candle reversal backtest"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "filelock>=3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
