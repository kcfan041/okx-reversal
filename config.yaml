paths:
  db: data/okx.duckdb
  logs: logs
  results: results
  lock: data/sync.lock

okx:
  base_url: https://www.okx.com
  proxy: null
  timeout_sec: 15
  max_requests_per_sec: 5
  history_requests_per_sec: 8
  market_requests_per_sec: 15
  history_limit: 300
  max_retries: 5
  backoff_base_sec: 1.0

universe:
  inst_type: SWAP
  quote_suffix: -USDT-SWAP
  btc_inst: BTC-USDT-SWAP
  exclude: []
  bar: 5m

sync:
  run_budget_sec: 240
  forward_first: true
  backfill_start: "2025-10-01T00:00:00Z"
  backfill_layers_days: [30, 90, 180, 365]
  backfill_bars_per_inst: 2000
  smoke_insts: [BTC-USDT-SWAP, ETH-USDT-SWAP, SOL-USDT-SWAP, DOGE-USDT-SWAP]
  smoke_days: 1
  oi5m_scope: focus   # focus = watchlist + top heat coins only; all = every instrument

detector:
  vol_ma_bars: 20
  pump:
    ret_24h_min: 0.50
    ret_6h_min: 0.30
    vol_ratio_min: 4.0
    vol_lookback_bars: 72
    measure: close_to_close
    allow_new_listing: true
    new_listing_min_bars: 72
  red_candle:
    ret_max: -0.08
    vol_ratio_min: 4.0
    ret_basis: prev_close
  cooldown_bars: 288

metrics:
  entry: next_open
  horizons:
    30m: 6
    1h: 12
    6h: 72
    24h: 288
    3d: 864
  excursion_bars: 288
  big_drop_threshold: -0.20
  fee_per_side: 0.0005
  slippage_per_side: 0.0005

btc_regime:
  ret_4h_weak: -0.01
  ret_4h_strong: 0.01
  ema_bars: 288

backtest:
  since: null
  until: null
  sweep:
    red_ret_max: [-0.05, -0.08, -0.10, -0.15]
    red_vol_ratio_min: [3.0, 4.0, 6.0]
  baseline:
    random_samples: 5000
    seed: 42
  bootstrap:
    iterations: 2000
    seed: 42

account:
  db: data/account.duckdb
  inst_types: [SWAP, FUTURES, SPOT]
  history_days: 92
  page_limit: 100
  review:
    post_exit_bars: [12, 72, 288]
    max_hold_bars_for_path: 8640
    revenge_window_min: 30
    stop_grid: [0.03, 0.05, 0.08, 0.12]
    hold_grid_bars: [12, 72, 288]
  replicate:
    min_trades_per_group: 5
    oos_split: 0.5
    max_matches_per_rule: 20000
    cooldown_bars: 288

heat:
  watchlist: [CT-USDT-SWAP]
  backfill_start: "2024-09-19"
  pct_window_days: 30
  alert_threshold: 80
  alert_cooldown_h: 6
  top_n: 10
  sentiment_all: true
  ls_all_every_min: 360
  liq_all_every_min: 60
  paper: true
  paper_thresholds: [80, 90]
  paper_exits: [24h, 24h_sl10pct, 24h_sl20pct]

announce:
  enabled: true
  db: data/announce.duckdb
  poll_min: 30
  max_sec: 30

chat:
  model: claude
  max_rounds: 12
  max_calls: 40
  max_tool_chars: 60000
  tool_result_chars: 12000
  daily_calls: 500
  max_tokens: 4000

lab:
  split_frac: 0.6667
  similar_k: 200
  confirm_n: 200
  recent_hours: 24

background:
  priority: idle
  threads: 2

replay:
  start: "2024-10-01"
  end: "2025-09-15"
  db: data/okx_old.duckdb
  out: data/replay.duckdb
  workers: 6

paper:
  db: data/paper.duckdb
  models_dir: data/models
  window_days: 8
  max_catchup_bars: 36
  snapshot_every_bars: 3
  max_sec: 75
  random_prob: 0.0002
  books:
    A: {label: "10,000U 每筆 2% 1x", equity: 10000, size_frac: 0.02, lever: 1, max_open: 10}
    B: {label: "仿你的習慣 20x", equity: 1300, notional: auto, lever: 20, max_open: 3}
    C: {label: "只記報酬率", unit: true}
  ml:
    exit: 6h_sl2atr
    stride: 24
    train_days: 365
    retrain_days: 7
    top_quantile: 0.995
    min_prob: 0.5
  twin:
    stride: 24
  llm:
    max_calls_per_day: 200
    max_cost_usd_per_day: 1000.0
    price_in_per_1k: 0.00015
    price_out_per_1k: 0.0006
    max_per_tick: 8
    max_per_bar: 2
    stale_min: 15
    max_sec: 50
    timeout_sec: 20

charts:
  enabled: true
  max_charts: 300
  pre_hours: 6
  post_hours: 48
  dpi: 110
